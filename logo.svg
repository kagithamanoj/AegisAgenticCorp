<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="100%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Split Shield Outline -->
  <path d="M80 20 L130 40 L130 90 C130 130 80 150 80 150 C80 150 30 130 30 90 L30 40 Z" 
        stroke="url(#blue-grad)" stroke-width="2" opacity="0.4" />

  <!-- Left A / Shield Part (Blue) -->
  <path d="M80 30 L45 110 L65 110 L80 75 L80 30 Z" 
        fill="url(#blue-grad)" filter="url(#glow)" />
  <path d="M40 45 L80 32 L80 44 L50 54 Z" 
        fill="#3b82f6" opacity="0.8" />

  <!-- Right A / Shield Part (Orange) -->
  <path d="M80 30 L115 110 L95 110 L80 75 L80 30 Z" 
        fill="url(#orange-grad)" filter="url(#glow)" />
  <path d="M120 45 L80 32 L80 44 L110 54 Z" 
        fill="#fb923c" opacity="0.8" />

  <!-- The Arrow (Orange dominant in original) -->
  <path d="M70 125 L105 55 L115 65 L125 45 L100 50 L110 60 L75 130 Z" 
        fill="url(#orange-grad)" filter="url(#glow)" />

  <!-- Deep Accent (Blue/Orange transition) -->
  <path d="M80 120 L100 135 L80 145 L60 135 Z" 
        fill="url(#blue-grad)" opacity="0.6" />
  
  <rect x="79" y="30" width="2" height="90" fill="#ffffff" opacity="0.1" />
</svg>
